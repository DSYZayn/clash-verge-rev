name: Team Worker CI

on:
  push:
    paths:
      - 'team-worker/**'
      - '.github/workflows/team-worker-ci.yml'
      - '.github/workflows/team-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} - ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team-worker
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'npm'
          cache-dependency-path: team-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate a test deployment config
        env:
          TEAM_DOMAIN: https://example.cloudflareaccess.com
          ACCESS_AUD: test-access-aud
          D1_DATABASE_ID: 00000000-0000-0000-0000-000000000000
          KV_NAMESPACE_ID: 00000000000000000000000000000000
        run: npm run config:prepare

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --config wrangler.generated.toml
