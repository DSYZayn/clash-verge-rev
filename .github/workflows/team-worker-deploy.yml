name: Deploy Team Worker

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'Apply pending D1 migrations before deployment'
        required: false
        type: boolean
        default: true
      sync_upstream_secret:
        description: 'Copy UPSTREAM_SUBSCRIPTION_URL from GitHub Secret to Worker Secret'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: team-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: team-production
    defaults:
      run:
        working-directory: team-worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TEAM_DOMAIN: ${{ vars.TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      WORKER_CUSTOM_DOMAIN: ${{ vars.WORKER_CUSTOM_DOMAIN }}
      DEFAULT_TEAM_NAME: ${{ vars.DEFAULT_TEAM_NAME }}
      CACHE_TTL_SECONDS: ${{ vars.CACHE_TTL_SECONDS }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
      KV_PREVIEW_NAMESPACE_ID: ${{ vars.KV_PREVIEW_NAMESPACE_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'npm'
          cache-dependency-path: team-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UPSTREAM_SUBSCRIPTION_URL: ${{ secrets.UPSTREAM_SUBSCRIPTION_URL }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing team-production secret: CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing team-production variable: CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$WORKER_CUSTOM_DOMAIN" || { echo 'Missing team-production variable: WORKER_CUSTOM_DOMAIN'; exit 1; }
          [[ "$WORKER_CUSTOM_DOMAIN" != *YOUR_* && "$WORKER_CUSTOM_DOMAIN" != *REPLACE_* ]] || { echo 'WORKER_CUSTOM_DOMAIN is still a placeholder'; exit 1; }
          if [[ '${{ inputs.sync_upstream_secret }}' == 'true' ]]; then
            test -n "$UPSTREAM_SUBSCRIPTION_URL" || { echo 'Missing team-production secret: UPSTREAM_SUBSCRIPTION_URL'; exit 1; }
          fi

      - name: Generate production Wrangler config
        run: npm run config:prepare

      - name: Typecheck
        run: npm run typecheck

      - name: Apply D1 migrations
        if: inputs.apply_migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply TEAM_DB --remote --config wrangler.generated.toml

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.generated.toml

      - name: Update upstream subscription secret
        if: inputs.sync_upstream_secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UPSTREAM_SUBSCRIPTION_URL: ${{ secrets.UPSTREAM_SUBSCRIPTION_URL }}
        run: printf '%s' "$UPSTREAM_SUBSCRIPTION_URL" | npx wrangler secret put UPSTREAM_SUBSCRIPTION_URL --config wrangler.generated.toml

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo '### Team Worker deployed'
            echo
            echo "- Worker: ${WORKER_NAME:-clash-verge-rev}"
            echo "- API origin: ${WORKER_CUSTOM_DOMAIN:-workers.dev URL from the deploy log}"
            echo "- D1 migrations: ${{ inputs.apply_migrations }}"
            echo "- Upstream secret synchronized: ${{ inputs.sync_upstream_secret }}"
          } >> "$GITHUB_STEP_SUMMARY"
