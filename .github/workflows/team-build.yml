name: Team Edition Build

on:
  # Single-branch model: codex/team-edition is the only branch (GitHub default
  # branch and the Worker's production branch), so one push builds the client
  # exactly once. Worker-only paths never trigger client builds.
  push:
    branches:
      - codex/team-edition
    paths-ignore:
      - 'team-worker/**'
      - 'docs/**'
      - '.github/workflows/team-worker-ci.yml'
      - '.github/workflows/team-worker-deploy.yml'
      - '.github/workflows/team-resource-push.yml'
  workflow_dispatch:
    inputs:
      publish_from_run:
        description: 'Skip the build; publish artifacts from an existing run ID'
        required: false
        type: string
        default: ''
      run_windows:
        description: 'Build Windows x64'
        required: false
        type: boolean
        default: true
      run_windows_arm64:
        description: 'Build Windows ARM64'
        required: false
        type: boolean
        default: false
      run_macos_aarch64:
        description: 'Build macOS aarch64'
        required: false
        type: boolean
        default: false
      run_linux_amd64:
        description: 'Build Linux amd64'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
concurrency:
  group: '${{ github.workflow }} - ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    environment: team-production
    if: github.event_name == 'push' || github.event.inputs.publish_from_run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            id: windows
            input: run_windows
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bundle: nsis
            id: windows-arm64
            input: run_windows_arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: 'dmg,app'
            id: macos-aarch64
            input: run_macos_aarch64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            id: linux-amd64
            input: run_linux_amd64

    runs-on: ${{ matrix.os }}
    steps:
      # jobs.<id>.if is evaluated before the matrix expands, so the platform
      # selection must live at step level (same pattern as dev.yml).
      - name: Skip job if not selected
        if: github.event_name == 'workflow_dispatch' && github.event.inputs[matrix.input] != 'true'
        run: echo "Job ${{ matrix.id }} skipped as requested"

      - name: Checkout Repository
        if: &selected github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.input] == 'true'
        uses: actions/checkout@v7

      - name: Install Rust Stable
        if: *selected
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust Cache
        if: *selected
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1-team-rust'
          key: 'rust-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04' && (github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.input] == 'true')
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        if: *selected
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        if: *selected
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'pnpm'

      # Real deployment values stay out of git: set repository variables
      # (Settings > Secrets and variables > Actions > Variables) to override
      # the placeholder src-tauri/resources/team-config.json at build time.
      - name: Apply team config from repository variables (optional)
        shell: pwsh
        env:
          TEAM_API_BASE_URL: ${{ vars.TEAM_API_BASE_URL || vars.WORKER_CUSTOM_DOMAIN }}
          TEAM_OAUTH_CLIENT_ID: ${{ vars.TEAM_OAUTH_CLIENT_ID }}
          TEAM_OAUTH_RESOURCE: ${{ vars.TEAM_OAUTH_RESOURCE }}
          TEAM_PROFILE_NAME: ${{ vars.TEAM_PROFILE_NAME }}
          TEAM_SYNC_INTERVAL_MINUTES: ${{ vars.TEAM_SYNC_INTERVAL_MINUTES }}
        if: *selected
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TEAM_API_BASE_URL)) {
            Write-Host 'TEAM_API_BASE_URL not set; keeping placeholder team-config.json (team features disabled).'
            exit 0
          }
          $config = [ordered]@{
            enabled = $true
            api_base_url = $env:TEAM_API_BASE_URL
            oauth_client_id = $env:TEAM_OAUTH_CLIENT_ID
            oauth_scopes = @()
            oauth_resource = $(if ($env:TEAM_OAUTH_RESOURCE) { $env:TEAM_OAUTH_RESOURCE } else { $env:TEAM_API_BASE_URL.TrimEnd('/') })
            account_path = '/v1/desktop/account'
            profile_path = '/v1/desktop/profile'
            managed_profile_name = $(if ($env:TEAM_PROFILE_NAME) { $env:TEAM_PROFILE_NAME } else { 'Team Network' })
            auto_activate = $true
            sync_interval_minutes = $(if ($env:TEAM_SYNC_INTERVAL_MINUTES) { [int]$env:TEAM_SYNC_INTERVAL_MINUTES } else { 360 })
          }
          $config | ConvertTo-Json | Set-Content -Path src-tauri/resources/team-config.json -Encoding utf8
          Write-Host 'team-config.json generated from repository variables.'

      # The updater compares this stamped version against the client's, so
      # every build must be unique: base version + run number.
      - name: Stamp build version
        if: *selected
        shell: pwsh
        run: |
          $base = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $version = "$base-team.$env:GITHUB_RUN_NUMBER"
          $teamConf = Get-Content src-tauri/tauri.team.conf.json -Raw | ConvertFrom-Json
          $teamConf | Add-Member -NotePropertyName version -NotePropertyValue $version -Force
          $teamConf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.team.conf.json -Encoding utf8
          Write-Host "build version: $version"

      - name: Pnpm install and prebuild
        if: *selected
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Add Rust Target
        if: *selected
        run: |
          rustup target add ${{ matrix.target }} --toolchain 1.95.0 || rustup target add ${{ matrix.target }}
          rustup target list --installed

      # The merge file src-tauri/tauri.team.conf.json points the updater at
      # this repository's rolling team-latest release (the base config still
      # references the upstream project). Passing inline --config JSON
      # through tauri-action is unreliable across shells, so a file path is
      # used instead.
      - name: Tauri build
        if: *selected
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tauriScript: pnpm
          args: --target ${{ matrix.target }} -b ${{ matrix.bundle }} --config src-tauri/tauri.team.conf.json

      - name: Upload Artifacts (Windows)
        if: matrix.os == 'windows-latest' && (github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.input] == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: clash-verge-team-${{ matrix.id }}
          archive: false
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Updater signatures/bundles ride in a zipped companion artifact so the
      # installer artifact stays a single directly downloadable file.
      - name: Upload Updater Files (Windows)
        if: matrix.os == 'windows-latest' && (github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.input] == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: clash-verge-team-${{ matrix.id }}-updater
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

      - name: Upload Artifacts (macOS)
        if: matrix.os == 'macos-latest' && (github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.input] == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: clash-verge-team-${{ matrix.id }}
          archive: false
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Updater Files (macOS)
        if: matrix.os == 'macos-latest' && (github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.input] == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: clash-verge-team-${{ matrix.id }}-updater
          path: target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

      - name: Upload Artifacts (Linux)
        if: matrix.os == 'ubuntu-22.04' && (github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.input] == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: clash-verge-team-${{ matrix.id }}
          archive: false
          path: target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload Updater Files (Linux)
        if: matrix.os == 'ubuntu-22.04' && (github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.input] == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: clash-verge-team-${{ matrix.id }}-updater
          path: target/${{ matrix.target }}/release/bundle/deb/*.deb.sig
          if-no-files-found: error

  # Rebuilds the rolling team-latest release after a full matrix run. Partial
  # manual builds (workflow_dispatch with only some platforms selected) skip
  # this job so the release never loses platforms. Dispatching with
  # publish_from_run set skips the build and republishes an earlier run's
  # artifacts (e.g. after a transient download failure in a previous publish).
  publish:
    name: Publish rolling release
    needs: build
    if: ${{ always() && !cancelled() && ((needs.build.result == 'success' && (github.event_name == 'push' || (github.event.inputs.run_windows == 'true' && github.event.inputs.run_windows_arm64 == 'true' && github.event.inputs.run_macos_aarch64 == 'true' && github.event.inputs.run_linux_amd64 == 'true'))) || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_from_run != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      # The artifacts API serves archive:false uploads as raw bytes, which
      # breaks gh run download / download-artifact ("not a valid zip file").
      # The helper sniffs the zip magic per artifact and retries each
      # download, so transient blob-fetch failures no longer kill the job.
      - name: Download build artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_FROM_RUN: ${{ github.event.inputs.publish_from_run }}
        run: |
          node scripts/download-run-artifacts.mjs "${PUBLISH_FROM_RUN:-$GITHUB_RUN_ID}" release-assets
          ls -la release-assets

      - name: Generate updater manifests
        shell: bash
        env:
          RELEASE_TAG: team-latest
          PUBLISH_FROM_RUN: ${{ github.event.inputs.publish_from_run }}
        run: |
          if [ -n "$PUBLISH_FROM_RUN" ]; then
            # Republishing an earlier run: take the version its payloads were
            # stamped with, not this dispatch's run number.
            ver=$(ls release-assets | grep -E '_x64-setup\.exe$' | head -1 | sed -E 's/^[^_]*_//; s/_x64-setup\.exe$//')
            [ -n "$ver" ] || { echo "cannot derive version from downloaded artifacts"; exit 1; }
            export UPDATE_VERSION="$ver"
          else
            base=$(grep -oP '"version"\s*:\s*"\K[^"]+' src-tauri/tauri.conf.json | head -1)
            export UPDATE_VERSION="$base-team.${{ github.run_number }}"
          fi
          echo "manifest version: $UPDATE_VERSION"
          node scripts/team-update-manifest.mjs release-assets

      - name: Publish to rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view team-latest >/dev/null 2>&1 || gh release create team-latest --title 'Team Latest' --notes 'Rolling Lab Clash Verge team build; updater manifest: update.json' --prerelease
          gh release upload team-latest release-assets/* --clobber
