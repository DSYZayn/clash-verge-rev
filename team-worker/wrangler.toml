name = "clash-verge-team-api"
main = "src/index.ts"
compatibility_date = "2026-08-20"
workers_dev = false

[vars]
# Include scheme, no trailing slash.
TEAM_DOMAIN = "https://YOUR-TEAM.cloudflareaccess.com"
ACCESS_AUD = "YOUR_ACCESS_APPLICATION_AUD"
DEFAULT_TEAM_NAME = "Your Team"
CACHE_TTL_SECONDS = "300"

[[d1_databases]]
binding = "TEAM_DB"
database_name = "clash-verge-team"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "RESOURCE_CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_NAMESPACE_ID"

# Configure outside source control:
#   wrangler secret put UPSTREAM_SUBSCRIPTION_URL
